<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NyayaSahayak — source-traceable legal claim, evidence, hearing and authority auditing workspace. Synthetic demonstration." />
    <title>NyayaSahayak — Evidence. Context. Traceability.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var raw = localStorage.getItem('nyaya-ui');
        var t = 'dark';
        if (raw) {
          var s = JSON.parse(raw).state || {};
          t = s.theme || 'dark';
          if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
